[project]
name = "zero-magic-funnel"
version = "0.3.0"
description = "Agentic development funnel backend: cards API and PRD-to-cards breakdown (weeks 1-3)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
