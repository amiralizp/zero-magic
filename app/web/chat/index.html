<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070a10">
    <title>Gantry AI · Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2367e8f9'/%3E%3Cpath d='M4 19h4v-4h4v-4h4V7h4' fill='none' stroke='%23041016' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/chat/assets/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <a class="logo" href="/console">
                    <span class="logo-mark">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19h4v-4h4v-4h4V7h4"/>
                        </svg>
                    </span>
                    <div class="logo-text">
                        <span class="logo-title">Gantry AI</span>
                        <span class="logo-sub">Powered by OpenCode</span>
                    </div>
                </a>
            </div>
            <div class="header-center">
                <select id="modelSelect" class="model-select" aria-label="انتخاب مدل"></select>
            </div>
            <div class="header-right">
                <a class="btn-icon" href="/console" title="بازگشت به کنسول">
                    <i class="bi bi-grid"></i>
                </a>
                <button id="newChatBtn" class="btn-icon" title="گفتگوی جدید">
                    <i class="bi bi-plus-lg"></i>
                </button>
                <button id="clearHistoryBtn" class="btn-icon" title="پاک کردن تاریخچه">
                    <i class="bi bi-trash3"></i>
                </button>
            </div>
        </header>

        <main class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-content">
                    <div class="welcome-logo">
                        <i class="bi bi-chat-dots-fill"></i>
                    </div>
                    <h1>سلام! چطور می‌تونم کمکی کنم؟</h1>
                    <p>یک دستیار سریع و فارسی روی بستر Gantry</p>
                    <div class="suggestions">
                        <button class="suggestion-card" data-prompt="به فارسی توضیح بده هوش مصنوعی چیست و چه کاربردهایی دارد؟">
                            <i class="bi bi-lightbulb"></i>
                            <span>هوش مصنوعی چیست؟</span>
                        </button>
                        <button class="suggestion-card" data-prompt="برام یک API ساده با FastAPI بنویس">
                            <i class="bi bi-code-slash"></i>
                            <span>نوشتن کد FastAPI</span>
                        </button>
                        <button class="suggestion-card" data-prompt="یک خلاصه حرفه‌ای از این متن بنویس:">
                            <i class="bi bi-file-text"></i>
                            <span>خلاصه‌سازی متن</span>
                        </button>
                        <button class="suggestion-card" data-prompt="برام یه برنامه غذایی سالم و اقتصادی پیشنهاد بده">
                            <i class="bi bi-apple"></i>
                            <span>برنامه غذایی</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="messages" id="messages"></div>
        </main>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="userInput" class="user-input" placeholder="پیامت رو بنویس... (Shift+Enter برای خط جدید)" rows="1" maxlength="8000"></textarea>
                <button id="sendBtn" class="send-btn" disabled>
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
            <div class="input-footer">
                <span class="footer-text">Gantry AI · OpenCode</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="/chat/assets/app.js"></script>
</body>
</html>
